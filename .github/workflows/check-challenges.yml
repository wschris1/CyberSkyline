name: Check challenge content

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check challenge files and answer leaks
        run: python3 .github/scripts/check_challenges.py
      - name: Test investigation tools and publication checks
        run: python3 -m unittest discover -s tests -v
      - name: Install optional bot dependencies
        run: python3 -m pip install -r bots/skyline_archive/requirements.txt
      - name: Test Discord archive workflows and scan controls
        run: python3 -m unittest discover -s tests -p 'test_skyline_*.py' -v
      - name: Check whitespace
        run: git show --format= --check HEAD
